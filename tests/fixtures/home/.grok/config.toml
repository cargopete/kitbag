# Grok Build user config
[ui]
theme = "dark"

[compat.claude]
skills = true

# GitHub, with a token pasted in by hand
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_FAKE0123456789abcdefghijklmnopqrstuv", LOG_LEVEL = "${LOG_LEVEL:-info}" }
startup_timeout_sec = 60

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
bearer_token_env_var = "LINEAR_API_KEY"
tool_timeout_sec = 120

[mcp_servers.old]
command = "old-mcp"
enabled = false
