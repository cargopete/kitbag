# Builds static binaries for every platform and attaches them, with SHA-256
# checksums, to a GitHub Release when a version tag (v*) is pushed.
# Asset names match what install.sh / install.ps1 download:
#   kitbag-<target>.tar.gz (.zip on Windows) and kitbag-<target>.sha256
# Each release also attaches install.sh and install.ps1.
# Each archive also gets a signed build provenance attestation; check one with
#   gh attestation verify kitbag-<target>.tar.gz -R cargopete/kitbag
#
# Third-party actions are pinned to a full commit SHA, with the release tag it
# was taken from in the trailing comment. Bump both together.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          # vX.Y.Z must match Cargo.toml exactly; release candidates vX.Y.Z-rc.N are allowed
          # for a matching X.Y.Z (they publish as draft prereleases for testing).
          case "${GITHUB_REF_NAME}" in
            "v$version" | "v$version"-*) ;;
            *) echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1 ;;
          esac
      - uses: taiki-e/create-gh-release-action@045e5c0ed9c50cc1f96de7e891a09ad3daea245f # v1.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the archives and checksums to the release
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/setup-cross-toolchain-action@0375eb1d01bea430aa3202965839a7092960a23b # v1.43.1
        with:
          target: ${{ matrix.target }}
        if: contains(matrix.target, 'linux')
      - name: Static CRT on Windows
        if: contains(matrix.target, 'windows')
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: kitbag
          target: ${{ matrix.target }}
          archive: kitbag-$target
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE
          profile: dist
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The archive the step above built and uploaded (.tar.gz, or .zip on Windows).
          subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}

  install-scripts:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach install.sh and install.ps1 to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Upload install scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" install.sh install.ps1 --clobber
